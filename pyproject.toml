[project]
name = "rag-gate"
version = "0.0.1"
description = "A hard documentary gate and citation verifier for RAG pipelines — stops the LLM from answering without evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Jefferson Wagner" }]
keywords = ["rag", "llm", "hallucination", "retrieval", "guardrails"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.6", "typer>=0.13"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ollama = ["ollama>=0.4"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
qdrant = ["qdrant-client>=1.11"]
sentence-transformers = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
rag-gate = "rag_gate.cli:app"

[project.urls]
Homepage = "https://github.com/jeffersonwagner/rag-gate"
Issues = "https://github.com/jeffersonwagner/rag-gate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_gate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["rag_gate"]
ignore_missing_imports = true
